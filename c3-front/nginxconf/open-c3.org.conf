   location ^~ /api/v3/ {
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Credentials 'true';
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

        rewrite /api/v3/(.+)$ /$1 break;
        proxy_pass http://c3_api_v3;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #proxy_set_header Host 'api.v3.open-c3.org';
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

#githubbook    location ^~ /book/ { rewrite /book/(.+)$ https://open-c3.github.io/$1 permanent; }

    include /data/Software/mydan/Connector/pp/thirdparty/open-c3-frontend/v.nginx.conf;

    location ~ ^/status/ {
        stub_status on;
        access_log off;
    }
    error_page 404 = /error404.json;
    error_page 500 = /error500.json;
    error_page 502 = /error502.json;
    error_page 503 = /error503.json;
    error_page 504 = /error504.json;

    location = /error404.json {
        internal;
        default_type application/json;
        return 404 '{"stat": false, "info": "Resource not found (HTTP 404)"}';
    }

    location = /error500.json {
        internal;
        default_type application/json;
        return 200 '{"stat": false, "info": "Internal server error (HTTP 500)"}';
    }

    location = /error502.json {
        internal;
        default_type application/json;
        return 200 '{"stat": false, "info": "Bad gateway - upstream service error (HTTP 502)"}';
    }

    location = /error503.json {
        internal;
        default_type application/json;
        return 200 '{"stat": false, "info": "Service unavailable - please try again later (HTTP 503)"}';
    }

    location = /error504.json {
        internal;
        default_type application/json;
        return 200 '{"stat": false, "info": "Gateway timeout - upstream service did not respond (HTTP 504)"}';
    }

}

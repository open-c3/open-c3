upstream c3_api_v3{
  server 127.0.0.1:7998;
  server 127.0.0.1:7999;
}

server {
    listen      88 default_server;

    include /data/open-c3-data/nginx.conf/allow.conf;

    location = /api/agent-install.sh {
        default_type text/plain;
    return 200 "#!/bin/bash

echo 'INSTALL OPEN-C3 AGENT'

# Detect OS and install dependencies
if grep -qi 'ubuntu' /etc/os-release; then
    # Ubuntu detected, using apt-get...
    rsync -help 1>/dev/null || apt-get install rsync -y
    make -help 1>/dev/null || apt-get install make -y
elif grep -qiE 'centos|rhel|rocky|alma' /etc/os-release; then
    # CentOS/RHEL-based system detected, using yum...
    rsync --help >/dev/null 2>&1 || sudo yum install -y rsync
    make --help  >/dev/null 2>&1 || sudo yum install -y make
else
    # Unknown OS, defaulting to yum...
    rsync --help >/dev/null 2>&1 || sudo yum install -y rsync
    make --help  >/dev/null 2>&1 || sudo yum install -y make
fi

curl -L $scheme://$http_host/api/scripts/installAgent.sh    | OPEN_C3_ADDR=$scheme://$http_host bash
curl -L $scheme://$http_host/api/scripts/installAgentMon.sh | OPEN_C3_ADDR=$scheme://$http_host bash
";
    }


    location = /release {
        rewrite /release /api/connector/release last;
    }

    location ^~ /demoslave/ {
        proxy_pass http://127.0.0.1;
        proxy_set_header Host 'api.demoslave.open-c3.org';
    }

    location ^~ /third-party/monitor/ {

        sub_filter '</body>' '<script src="/assets/js/check-login.js" type="text/javascript" charset="utf-8"></script></body>';
        sub_filter_once on;

        proxy_pass http://OPENC3_LUA_IP;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host; #Deed_To_Motify_When_in_AllInOne
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /third-party/keycloak/ {

        sub_filter '</body>' '<script src="/assets/js/check-login.js" type="text/javascript" charset="utf-8"></script></body>';
        sub_filter_once on;

        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
#       proxy_set_header X-Forwarded-Proto $scheme;

#       proxy_pass http://openc3-keycloak:8080;
        proxy_pass http://OPENC3_LUA_IP;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Host 'OPENC3_LUA_IP';
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /webshell/ {
        alias  /data/Software/mydan/web-shell/html/;
        index  index.php index.html index.htm index.pl;
    }

    location ^~ /webshell/tty/ {

        rewrite /webshell/tty/(.+)$ /$1 break;
        proxy_pass http://127.0.0.1:3388;
    }
 
   location ^~ /webshell/socket.io/ {

        rewrite /webshell/(.+)$ /$1 break;
        proxy_pass http://127.0.0.1:3388;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
 
   location ^~ /api/connector/ {
        add_header Access-Control-Allow-Origin $http_origin;
        add_header Access-Control-Allow-Credentials 'true';
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

        rewrite /api/connector/(.+)$ /$1 break;
        proxy_pass http://api.connector.open-c3.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host 'api.connector.open-c3.org';
        proxy_http_version 1.1;

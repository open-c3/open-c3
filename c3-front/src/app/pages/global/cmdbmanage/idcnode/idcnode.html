<div class="row block">
    <h2>{{'C3T.IDC节点'|translate}}</h2>
    <hr class="mv20 clear">

    <div>
        <div style="float: right;">
            <form class="form-inline" name="myForm" novalidate>
                <button type="submit" class="btn btn-primary" style="padding: 10px 25px" ng-click="cmdbmanageidcnode.create()"><i class="fa fa-plusecircle fa-lg" aria-hidden="true"></i> {{'C3T.添加'|translate}}</button>
            </form>
        </div>
        <div style="clear: both;">&nbsp;</div>
    </div>

    <div class="panel panel-primary">
        <div class="panel-heading">
            <span class="panel-controls">
                <button class="btn btn-primary" uib-tooltip="{{'C3T.刷新'|translate}}" ng-click="cmdbmanageidcnode.reload()" ><i class="fa fa-refresh fa-fw" ng-class="{'fa-spin':!cmdbmanageidcnode.loadover}" ></i></button>
            </span>
            <h5>{{'C3T.IDC节点'|translate}}</h5>
        </div>

        <div class="panel-body">
            <div class="pt20" style="overflow: auto;">
                <table ng-table="cmdbmanageidcnode.dataTable" class="table table-scroll table-hover text-left table-condensed" show-filter="true">
                    <tr ng-repeat="m in $data">
                        <td data-title="'ID'"                        width="80" filter="{ id: 'text'}"           data-sortable="'id'">            {{m.id}}            </td>
                        <td data-title="'C3T.资产编号'|translate"    width="80" filter="{ asset_number: 'text'}"  data-sortable="'asset_number'">   {{m.asset_number}}   </td>
                        <td data-title="'C3T.服务器名'|translate"    width="80" filter="{ server_name: 'text'}"  data-sortable="'server_name'">   {{m.server_name}}   </td>
                        <td data-title="'C3T.类型'|translate"    width="80" filter="{ resource_type: 'text'}"  data-sortable="'resource_type'">   {{m.resource_type}}   </td>
                        <td data-title="'C3T.内网IP'|translate"    width="80" filter="{ private_ip: 'text'}"  data-sortable="'private_ip'">   {{m.private_ip}}   </td>
                        <td data-title="'C3T.公网IP'|translate"    width="80" filter="{ public_ip: 'text'}"  data-sortable="'public_ip'">   {{m.public_ip}}   </td>
                        <td data-title="'C3T.操作系统类型'|translate"    width="80" filter="{ operating_system_type: 'text'}"  data-sortable="'operating_system_type'">   {{m.operating_system_type}}   </td>
                        <td data-title="'C3T.状态'|translate"    width="80" filter="{ status: 'text'}"  data-sortable="'status'">   {{m.status}}   </td>
                        <td data-title="'C3T.城市'|translate"    width="80" filter="{ city: 'text'}"  data-sortable="'city'">   {{m.city}}   </td>
                        <td data-title="'C3T.机房区域'|translate"    width="80" filter="{ data_center_area: 'text'}"  data-sortable="'data_center_area'">   {{m.data_center_area}}   </td>
                        <td data-title="'C3T.编辑人'|translate"      width="80" filter="{ edit_user: 'text'}"    data-sortable="'edit_user'">     {{m.edit_user}}     </td>
                        <td data-title="'C3T.编辑时间'|translate"    width="80" filter="{ edit_time: 'text'}"    data-sortable="'edit_time'">     {{m.edit_time}}     </td>
                        <td style="width: 10%" data-title="'C3T.操作'|translate">
                            <button class="btn btn-primary btn-sm" ng-click="cmdbmanageidcnode.create(m.id)">{{'C3T.编辑'|translate}}</button>
                            <button class="btn btn-danger btn-sm"  ng-click="cmdbmanageidcnode.delete(m.id)">{{'C3T.删除'|translate}}</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
       <div class="row">
            <div class="col-sm-5 form-group pull-right">
                <button class="btn btn-warning" ng-click="cmdbmanageidcnode.cancel()">{{'C3T.取消'|translate}}</button>
            </div>
        </div>
  
    </div>

</div>

<style>.modal-dialog {width: 80%;} </style>

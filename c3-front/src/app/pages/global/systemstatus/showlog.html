<div class="row block">
    <div class="panel panel-primary">
        <div class="panel-heading">
            <span class="panel-controls">
                <button class="btn btn-primary" uib-tooltip="{{'C3T.刷新'|translate}}" ng-click="systemstatusshowlog.reload()" ><i class="fa fa-refresh fa-fw" ng-class="{'fa-spin':!systemstatusshowlog.loadover}" ></i></button>
                <button class="btn btn-primary" uib-tooltip="{{'C3T.关闭'|translate}}" ng-click="systemstatusshowlog.cancel()"><i class="fa fa-times" aria-hidden="true"></i></button>
            </span>
            <h5>日志:{{ systemstatusshowlog.postdata.system }}/{{ systemstatusshowlog.postdata.module }}/{{ systemstatusshowlog.postdata.group }}/{{ systemstatusshowlog.postdata.name }}</h5>
        </div>

        <div class="panel-body">
            <div class="pt20">
                <div id="systemstatuslog" style="background:#000; color:#FFF;font-size: 14px;font-weight: bold;padding: 6px">
            </div>
        </div>
        <div class="panel-footer text-right">
            <button class="btn btn-warning" ng-click="systemstatusshowlog.cancel()">{{'C3T.关闭'|translate}}</button>
        </div>

    </div>

</div>
